# CrossTrans test suite.
#
# windows-latest because the app is Windows-only: it registers global hotkeys,
# talks to the registry, reads the clipboard through pywin32 and draws Tk widgets.
# There is nothing meaningful to run on Linux.
#
# The count guard at the end is not ceremony. `tests/conftest.py`'s `tk_root`
# fixture *skips* when there is no usable display, and 312 of the 630 tests need
# one - so a runner without a desktop session would skip half the suite and still
# hand back a green tick. See tools/check_test_counts.py.
name: tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push to the same branch makes the older run pointless.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the version the project is developed on.
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Report whether Tk is usable
        # Informational only - the guard below is what actually fails the build.
        # Printed so a mass-skip failure can be diagnosed without guessing.
        continue-on-error: true
        run: |
          python -c "import tkinter; r = tkinter.Tk(); r.destroy(); print('Tk: usable')"

      - name: Run tests
        run: |
          python -m pytest tests/ -q --junitxml=junit.xml --cov=src --cov-report=term-missing

      - name: Check the run actually ran
        if: always()
        run: |
          python tools/check_test_counts.py junit.xml --min-total 500

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ github.run_id }}
          path: junit.xml
          if-no-files-found: warn
